<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agenda</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        form {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input, button {
            padding: 8px;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #333;
            color: white;
        }

        .negativo {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>📅 Minha Agenda</h1>

<form action="/add" method="POST">
    <input type="text" name="task" placeholder="Tarefa" required>
    <input type="date" name="date">
    <input type="text" name="comment" placeholder="Comentário">
    <button type="submit">Adicionar</button>
</form>

<table>
    <tr>
        <th>Tarefa</th>
        <th>Data</th>
        <th>Dia</th>
        <th>Dias Restantes</th>
        <th>Comentário</th>
        <th>Ação</th>
    </tr>

    {% for task in tasks %}
    <tr>
        <td>{{ task[1] }}</td>
        <td>{{ task[2] }}</td>
        <td>{{ task[4] }}</td>

        <td class="dias-restantes" data-date="{{ task[2] }}">
            {{ task[3] }}
        </td>

        <td>{{ task[5] }}</td>

        <td>
            <a href="/delete/{{ task[0] }}">Excluir</a>
        </td>
    </tr>
    {% endfor %}
</table>

<script>
function calcularDiasRestantes(dataStr) {
    if (!dataStr) return "";

    const hoje = new Date();
    const data = new Date(dataStr);

    hoje.setHours(0,0,0,0);
    data.setHours(0,0,0,0);

    const diff = Math.ceil((data - hoje) / (1000 * 60 * 60 * 24)) + 1;

    return diff;
}

function atualizarDias() {
    document.querySelectorAll(".dias-restantes").forEach(el => {
        const data = el.dataset.date;

        if (data) {
            const dias = calcularDiasRestantes(data);

            el.innerText = dias;

            if (dias < 0) {
                el.classList.add("negativo");
            } else {
                el.classList.remove("negativo");
            }
        }
    });
}

// roda ao abrir
atualizarDias();

// atualiza sozinho
setInterval(atualizarDias, 60000);
</script>

</body>
</html>
