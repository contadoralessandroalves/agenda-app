<!DOCTYPE html>
<html>
<head>
    <title>Agenda</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border-bottom: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f4f4f4;
        }

        .late { color: red; }
        .soon { color: orange; }
        .ok { color: green; }
    </style>
</head>
<body>

<h2>📋 Tarefas</h2>

<form action="/add" method="post">
    <input type="text" name="task" placeholder="Tarefa" required>
    <input type="date" name="date">
    <input type="text" name="comment" placeholder="Comentário">
    <button type="submit">Adicionar</button>
</form>

<br>

<table>
    <tr>
        <th>Tarefa</th>
        <th>Data</th>
        <th>Dias</th>
        <th>Comentário</th>
        <th>Excluir</th>
    </tr>

    {% for t in tasks %}
    <tr>
        <td>{{ t[1][:40] }}</td>

        <td>
            {{ t[2] }} <br>
            <small>{{ t[4] }}</small>
        </td>

        <td>
            {% if t[3] is not none %}
                {% if t[3] < 0 %}
                    <span class="late">{{ t[3] }} dias</span>
                {% elif t[3] <= 3 %}
                    <span class="soon">{{ t[3] }} dias</span>
                {% else %}
                    <span class="ok">{{ t[3] }} dias</span>
                {% endif %}
            {% endif %}
        </td>

        <td>{{ t[5][:80] }}</td>

        <td>
            <a href="/delete/{{ t[0] }}">❌</a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
